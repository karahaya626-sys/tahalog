name: Normalize article images on macOS

on:
  push:
    paths:
      - '.github/workflows/normalize-article-images-macos.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run normalization script
        shell: bash
        run: |
          python3 <<'BOOT'
          from pathlib import Path

          source = Path('.github/workflows/normalize-article-images.yml').read_text(encoding='utf-8')
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n"
          start = source.index(marker_start) + len(marker_start)
          end = source.index(marker_end, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/normalize_articles.py').write_text(script + '\n', encoding='utf-8')
          BOOT
          python3 /tmp/normalize_articles.py

      - name: Install dependencies
        run: npm ci

      - name: Validate article images
        run: npm run check:article-images

      - name: Validate production build
        run: npm run build

      - name: Commit normalized articles and images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/normalize-article-images.yml
          rm -f .github/workflows/normalize-article-images-macos.yml
          git add src/content/blog src/assets/images/vena src/assets/images/wanderburg scripts/check-article-images.mjs package.json .github/workflows/normalize-article-images.yml .github/workflows/normalize-article-images-macos.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize article images'
          git push
