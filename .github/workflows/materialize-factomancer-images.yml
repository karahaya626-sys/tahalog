name: Materialize Factomancer images

on:
  push:
    branches:
      - fix/factomancer-screenshots-clean
    paths:
      - .github/workflows/materialize-factomancer-images.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/factomancer-screenshots-clean

      - name: Decode and verify screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/images/factomancer

          cat .asset-staging/factomancer-clean/title42-*.b64 | base64 --decode > src/assets/images/factomancer/factomancer-title.avif
          cat .asset-staging/factomancer-clean/grimoire-*.b64 | base64 --decode > src/assets/images/factomancer/factomancer-grimoire.avif
          cat .asset-staging/factomancer-clean/factory42-*.b64 | base64 --decode > src/assets/images/factomancer/factomancer-factory.avif

          echo '149266f3bddda73ae0ac7f5ad7452024663036860a76402fce0cf2f940a27215  src/assets/images/factomancer/factomancer-title.avif' | sha256sum -c -
          echo 'e6e059dc82b20c57a9920f5b1008acce76fc3d13dcbbafad3eb1dfd246e82653  src/assets/images/factomancer/factomancer-grimoire.avif' | sha256sum -c -
          echo '35e40f256de0a0606672cf7c4f61d54cde3fc3d746cf30d4df5e7e0473e8aa49  src/assets/images/factomancer/factomancer-factory.avif' | sha256sum -c -

          rm -rf .asset-staging/factomancer-clean
          rm -f .github/workflows/materialize-factomancer-images.yml

      - name: Commit generated images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add original Factomancer screenshots'
          git push origin HEAD:fix/factomancer-screenshots-clean
