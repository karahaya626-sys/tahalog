name: Diagnose Factomancer image chunks

on:
  push:
    branches:
      - fix/factomancer-images-publish

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic report
        shell: bash
        run: |
          set +e
          report=.asset-diagnostic.txt
          : > "$report"
          echo 'CHUNK HASHES' >> "$report"
          sha256sum .asset-new/factomancer/*.b64 >> "$report"
          echo >> "$report"
          echo 'EXPECTED CHUNK HASHES' >> "$report"
          cat >> "$report" <<'EOF'
          b79d823fc7226731b12d7d6135d9011063435db4491e957f005deb535c8fa2ec  .asset-new/factomancer/factory-00.b64
          6582f8ea3a399b06aa5f626a6c9794096f1965cdca05e692314a9a7aca431dc5  .asset-new/factomancer/factory-01.b64
          ae72911831671688efdf5a58c254a73c8706497c37d2f966a4d0b87fa68fb071  .asset-new/factomancer/factory-02.b64
          95adb727e1cf34f7f8249133352f5486c2423151163587aefdca716428ac8a1d  .asset-new/factomancer/grimoire-00.b64
          17df1158412c08a67fe8541f179a2f055e22e00c71ed47d7072519aa8a16f57a  .asset-new/factomancer/grimoire-01.b64
          9f6e31d0c8cd34b4a6ce9f87d43b0f5e95ca715683cf11b5b0745cc56767c18d  .asset-new/factomancer/title-00.b64
          417454a397713b46a1a4f1ffdf8613768b36c9c61eb38e66941608050674f17b  .asset-new/factomancer/title-01.b64
          786f552469cfce34d1fc06805ae112e7a857555ec1864e8a0f34e76eb3e25b6f  .asset-new/factomancer/title-02.b64
          EOF
          mkdir -p /tmp/factomancer
          echo >> "$report"
          echo 'DECODE RESULTS' >> "$report"
          for name in title grimoire factory; do
            cat .asset-new/factomancer/${name}-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/factomancer/${name}.webp
            status=$?
            echo "$name decode_status=$status bytes=$(wc -c < /tmp/factomancer/${name}.webp)" >> "$report"
            sha256sum /tmp/factomancer/${name}.webp >> "$report"
            file /tmp/factomancer/${name}.webp >> "$report"
          done
      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .asset-diagnostic.txt
          git commit -m 'Record Factomancer chunk diagnostics'
          git push
