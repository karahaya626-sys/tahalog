name: Materialize Factomancer images

on:
  push:
    branches:
      - fix/factomancer-images-publish

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and verify screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/images/factomancer

          cat .asset-new/factomancer/title-*.b64 | tr -d '\r\n' | base64 --decode > src/assets/images/factomancer/factomancer-title.webp
          cat .asset-new/factomancer/grimoire-*.b64 | tr -d '\r\n' | base64 --decode > src/assets/images/factomancer/factomancer-grimoire.webp
          cat .asset-new/factomancer/factory-*.b64 | tr -d '\r\n' | base64 --decode > src/assets/images/factomancer/factomancer-factory.webp

          echo 'a0eaa5affdf768653fb162c692def59231554a40aa3923324139bc0af49d01af  src/assets/images/factomancer/factomancer-title.webp' | sha256sum -c -
          echo '538c632992b0092c2bb3ff0a36122961420c4530fc967373b20e31a9ee54d5d2  src/assets/images/factomancer/factomancer-grimoire.webp' | sha256sum -c -
          echo 'b74172ad1c400655e67b7dda8bc4bb8f69c9628da781ff686faac9fe2b7e06da  src/assets/images/factomancer/factomancer-factory.webp' | sha256sum -c -

          file src/assets/images/factomancer/factomancer-*.webp

      - name: Update article image references
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/content/blog/factomancer-demo-play-report.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "heroImage: '../../assets/images/factomancer/official-factory.webp'",
              "heroImage: '../../assets/images/factomancer/factomancer-title.webp'",
              1,
          )
          text = text.replace(
              '../../assets/images/factomancer/official-factory.webp',
              '../../assets/images/factomancer/factomancer-factory.webp',
              1,
          )
          text = text.replace(
              '*工場を拡張しながら、複数の製作ルートをつないでいく。画像出典：[Factomancer Steamストア](https://store.steampowered.com/app/3979570/Factomancer/?l=japanese)／© Voltige Games*',
              '*6日目まで育てた工場。体験版プレイ時に撮影。*',
              1,
          )
          text = text.replace(
              '../../assets/images/factomancer/official-grimoire.webp',
              '../../assets/images/factomancer/factomancer-grimoire.webp',
              1,
          )
          text = text.replace(
              '*必要な原料や機械、関連する製作物を確認できる。画像出典：[Factomancer Steamストア](https://store.steampowered.com/app/3979570/Factomancer/?l=japanese)／© Voltige Games*',
              '*原料から製作可能なアイテムを絞り込んだグリモワール。体験版プレイ時に撮影。*',
              1,
          )

          required = [
              'factomancer-title.webp',
              'factomancer-factory.webp',
              'factomancer-grimoire.webp',
          ]
          if not all(item in text for item in required):
              raise SystemExit('Article image references were not updated correctly')
          if 'official-factory.webp' in text or 'official-grimoire.webp' in text:
              raise SystemExit('Old official image references remain')

          path.write_text(text, encoding='utf-8')

      - name: Build Astro site
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Remove staging files
        shell: bash
        run: |
          rm -rf .asset-new .asset-old .asset-upload

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use original Factomancer screenshots'
          git push
