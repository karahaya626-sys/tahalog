name: Clean up Factomancer image workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-merge-factomancer-images.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/auto-merge-factomancer-images.yml
          rm -f .github/workflows/verify-factomancer-images.yml
          rm -f .github/workflows/cleanup-factomancer-image-workflows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Factomancer image workflows"
          git push
