name: Publish Guildrun article

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-guildrun.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download official Steam images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/images/guildrun
          curl -fL 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3669200/ba1be5e06b4213bdc210aafb0fa151acf9947d34/header.jpg?t=1784638648' -o src/assets/images/guildrun/header.jpg
          curl -fL 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3669200/extras/265080b1517a9b178febf964379b518e.avif?t=1784638648' -o src/assets/images/guildrun/team-building.avif
          curl -fL 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3669200/extras/dc61c56a829b111b86704547308fd3a3.avif?t=1784638648' -o src/assets/images/guildrun/hero-builds.avif
          curl -fL 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3669200/extras/ecb24d4bfc6f5fa6ed809805f54e7ecd.avif?t=1784638648' -o src/assets/images/guildrun/progression.avif

      - name: Create article
        shell: bash
        run: |
          cat > src/content/blog/guildrun-overview.md <<'EOF'
          ---
          title: "『Guildrun』はどんなゲーム？高評価PvEオートバトルローグライクの特徴"
          description: "ヒーローを自由に育成し、アイテムやレリックのシナジーで怪物の群れへ挑む『Guildrun』。ゲーム内容、日本語対応、体験版、海外コミュニティの評価を整理する。"
          pubDate: 2026-08-07
          heroImage: '../../assets/images/guildrun/header.jpg'
          category: "Games"
          tags: ["Guildrun", "オートバトル", "ローグライト", "デッキ構築", "Steam"]
          author: "taha"
          draft: false
          ---

          『Guildrun』は、ヒーローを集めて編成し、戦闘そのものは自動で進むPvEオートバトル・ローグライクである。

          オートバトルと聞くと、強いユニットを並べた後は眺めるだけのゲームを想像するかもしれない。しかし本作では、ヒーローの配置、レベルアップ先、アイテムやレリックの組み合わせを毎回選び直す。後衛のヒーラーを前衛タンクへ変えたり、遠距離アタッカーを近接型へ作り替えたりと、クラスの役割を意図的に壊すビルドが大きな特徴である。

          2026年7月16日に公開された無料体験版は、記事執筆時点でSteamレビュー1,500件中90％が好評の「非常に好評」となっている。正式版は発売日未定だが、体験版だけでもかなり大きな反響を集めている作品だ。

          今回はまだ実際にはプレイしていないため、Steam公式情報と体験版へ寄せられたコミュニティの反応をもとに、どんなゲームなのかを整理する。

          > ※本記事は2026年8月7日時点の情報をもとにしている。発売時期、対応言語、体験版の内容、レビュー数は今後変更される可能性がある。

          ## 『Guildrun』とは

          『Guildrun』は、Leylineが開発・販売するシングルプレイヤー向けPvEオートバトル・ローグライクである。

          世界各地に出現した次元の裂け目を封印するため、個性の異なるヒーローたちをギルドへ集め、押し寄せる怪物の群れを倒していく。

          | 項目 | 内容 |
          |---|---|
          | 開発・販売 | Leyline |
          | ジャンル | PvEオートバトル・ローグライク・ストラテジー |
          | プレイ人数 | シングルプレイ |
          | 対応OS | Windows / macOS |
          | 日本語 | 現時点では未対応 |
          | 正式版発売日 | 未定 |
          | 体験版 | Steamで無料配信中 |
          | 体験版公開日 | 2026年7月16日 |

          ![ヒーローを編成して戦うGuildrunの戦闘画面](../../assets/images/guildrun/team-building.avif)

          *配置と育成方針を決めた後、戦闘は自動で進行する。画像出典：[Steamストア](https://store.steampowered.com/app/3669200/Guildrun/)／© Leyline*

          ## 戦闘は自動だが、判断することは多い

          『Guildrun』では、プレイヤーが直接キャラクターを操作して攻撃するわけではない。戦闘前にチームを編成し、配置や育成方針を決めると、ヒーローたちが自動で戦う。

          重要なのは、戦闘そのものよりもそこへ至るまでの判断である。

          - どのヒーローを仲間にするか
          - 前衛と後衛をどう配置するか
          - 誰へアイテムを集中させるか
          - 目の前の編成を伸ばすか、途中で別の構成へ切り替えるか
          - レリック同士の効果をどう重ねるか

          PvPではないため、対戦環境の流行へ合わせる必要はない。毎回提示された選択肢を見ながら、その場で強いチームへ組み替えていくゲームとなっている。

          また、制限時間や対戦待ち時間はなく、ラン途中のセーブにも対応する。オートバトラーに興味はあるものの、対人戦の速度やプレッシャーが苦手という人にも入りやすそうだ。

          ## クラスの役割を壊せる自由な育成

          本作の大きな特徴は、各ヒーローを初期クラス通りに育てる必要がないことだ。

          公式では、後衛ヒーラーを前衛タンクへ変えたり、遠距離DPSを近接ファイターへ育てたりする例が紹介されている。キャラクターの素の能力だけでなく、レベルアップ、専門化、アイテム、レリックを重ねることで、最初の役割とは別物のユニットへ変えられる。

          ![ヒーローの能力と専門化を組み合わせる育成画面](../../assets/images/guildrun/hero-builds.avif)

          *初期クラスは出発点にすぎず、ラン中の選択によって役割を大きく変えられる。画像出典：[Steamストア](https://store.steampowered.com/app/3669200/Guildrun/)／© Leyline*

          体験版だけでも、公式には以下の要素が収録されている。

          - 25人のヒーロー
          - 180種類のスペシャライゼーション
          - 300種類以上のレリック
          - 100種類以上のアイテム
          - 8段階の難易度
          - エンドレスモード

          数字だけでもかなり大きいが、単に選択肢が多いだけではない。クラスをまたいで効果を重ねられるため、同じヒーローでもランごとに違う役割を持たせられる。

          恋人同士のヒーローを同時に配置して成長ボーナスを得る、といったユニークな組み合わせも存在する。

          ## ローグライクらしく、途中で編成を切り替える

          毎回同じ完成形を目指すのではなく、そのランで手に入ったヒーローやレリックへ合わせて方針を変えることが重要になる。

          予定していたアイテムが出なければ、別のヒーローを主力へ切り替える。強力なレリックが手に入ったなら、その効果を最大限に使える編成へ組み直す。こうした「途中での方向転換」が、ローグライクとしての面白さにつながる。

          ![ランごとに解放要素と難易度が増えていくGuildrun](../../assets/images/guildrun/progression.avif)

          *クリアするたびに難しい条件が解放され、最終的にはエンドレスモードとランキングへ挑める。画像出典：[Steamストア](https://store.steampowered.com/app/3669200/Guildrun/)／© Leyline*

          成功したランの後は次の難易度が解放され、最大8段階まで挑戦できる。さらにエンドレスモードでは、グローバルランキングを目指して編成を伸ばし続けられる。

          ## 海外コミュニティの評価

          2026年8月7日時点で、Steamの無料体験版はレビュー1,500件中90％が好評となっている。体験版としてはレビュー数が多く、正式版発売前としてはかなり強い反応である。

          ### 評価されている点

          コミュニティで特に好意的に語られているのは、次のような部分だ。

          - PvPではなく、自分のペースで遊べるPvEオートバトラーである
          - オート戦闘でも、編成や育成の選択が結果へ大きく影響する
          - ヒーローの役割を変えられ、ビルドの幅が広い
          - UIが見やすく、オートバトラー未経験でも入りやすい
          - 体験版の時点で解放要素と繰り返し遊べる量が多い

          Redditでは、TFTのような対人オートバトラーを遊んだ経験がある人だけでなく、対人戦が苦手だった人からも「PvEで遊べるのがよい」「ゲーム任せではなく選択に手応えがある」と評価されている。

          Steamストアには、オートバトラー系を扱う動画投稿者から「お気に入りのオートバトルローグライクかもしれない」「久しぶりに遊んだ中でも特に良い」といったコメントも掲載されている。

          ### 気になる点

          一方で、現時点では次の点に注意が必要だ。

          - 日本語には対応していない
          - ヒーロー、専門化、アイテム、レリックの数が多く、最初は把握しにくい
          - 高難度では、欲しい強化を引けるかによって厳しさが大きく変わるという声がある
          - 正式版の発売日や価格はまだ発表されていない

          カジュアルに始められる一方で、難易度が上がると配置、アイテム管理、途中での編成変更まで求められる。見た目以上に考えることが多いゲームになりそうだ。

          ## 日本語には未対応

          Steamストアでは、英語、ドイツ語、中国語など7言語へ対応しているが、日本語は現時点でサポートされていない。

          ヒーローの能力、アイテム、レリックの説明を読みながらビルドを組むゲームなので、英語が苦手な場合は遊びにくさが残る。レビュー評価は高いものの、日本語対応を待ちたい人も多そうだ。

          正式版までに対応言語が追加される可能性はあるが、現時点で日本語対応の告知は確認できない。

          ## どんな人に合いそうか

          『Guildrun』は、次のような人と相性がよさそうだ。

          - TFTなどのオートバトラーが好きだが、PvPは疲れる
          - キャラクターの配置やシナジーを考えるのが好き
          - ローグライクで毎回違うビルドを試したい
          - 強い組み合わせを見つけてゲームを壊す感覚が好き
          - 時間制限なしでじっくり考えたい

          反対に、日本語対応が必須の人や、キャラクターを直接操作するアクションを求める人には現状向いていない。

          ## まとめ

          『Guildrun』は、PvEに特化したオートバトルへ、ローグライクらしいランダム性と自由度の高いヒーロー育成を組み合わせた作品である。

          戦闘は自動だが、クラスを超えた育成、配置、アイテム、レリックの組み合わせによって、プレイヤーの判断が結果へ大きく反映される。制限時間や対人戦がなく、自分のペースで遊べる点も大きな強みだ。

          体験版はすでに1,500件のレビューを集め、90％が好評。日本語未対応という壁はあるものの、オートバトルやビルド構築が好きなら、正式版前に触れておく価値は高そうだ。

          - [『Guildrun』正式版のSteamページ](https://store.steampowered.com/app/3669200/Guildrun/)
          - [『Guildrun Demo』のSteamページ](https://store.steampowered.com/app/4425970/Guildrun_Demo/)
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit article and images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-guildrun.yml
          git add src/content/blog/guildrun-overview.md src/assets/images/guildrun
          git commit -m "Add Guildrun overview"
          git push
