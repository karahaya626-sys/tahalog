name: Publish Guildrun article

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-guildrun-article.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download official Steam images
        shell: bash
        run: |
          mkdir -p src/assets/images/guildrun
          python <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          app_id = 3669200
          api_url = f'https://store.steampowered.com/api/appdetails?appids={app_id}&l=english'
          request = Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urlopen(request, timeout=30) as response:
              payload = json.load(response)

          data = payload[str(app_id)]['data']
          image_urls = [data['header_image'], *[shot['path_full'] for shot in data.get('screenshots', [])[:3]]]
          output_names = ['header.jpg', 'screenshot-1.jpg', 'screenshot-2.jpg', 'screenshot-3.jpg']

          if len(image_urls) < 4:
              raise SystemExit('Steam did not return enough Guildrun screenshots')

          target_dir = Path('src/assets/images/guildrun')
          for url, name in zip(image_urls, output_names):
              image_request = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(image_request, timeout=30) as response:
                  content = response.read()
              if len(content) < 10_000:
                  raise SystemExit(f'Downloaded image is unexpectedly small: {name}')
              (target_dir / name).write_bytes(content)
          PY

      - name: Create article
        shell: bash
        run: |
          cat > src/content/blog/guildrun-overview.md <<'EOF'
          ---
          title: "高評価PvEオートバトラー『Guildrun』とは？体験版の内容と海外評価"
          description: "ヒーローの役割を自由に変え、アイテムやレリックで強力な編成を作るPvEオートバトラー『Guildrun』。体験版の内容、日本語対応、発売時期、海外評価をまとめる。"
          pubDate: 2026-08-07
          heroImage: '../../assets/images/guildrun/header.jpg'
          category: "Games"
          tags: ["Guildrun", "オートバトル", "ローグライト", "Steam"]
          author: "taha"
          draft: false
          ---

          『Guildrun』は、個性の異なるヒーローを集め、アイテムやレリックを組み合わせて強力な編成を作るPvEローグライク・オートバトラーである。

          戦闘そのものは自動で進むが、プレイヤーが眺めているだけのゲームではない。どのヒーローを採用し、どの成長先を選び、誰にアイテムを持たせるかによって、同じキャラクターでも役割が大きく変化する。

          PvPの流行ビルドや制限時間に追われず、自分のペースで編成を考えられるのも特徴だ。無料体験版の時点で膨大なヒーロー、特化先、レリックが収録されており、2026年7月の公開後すぐに大きな注目を集めている。

          今回はまだ実際にはプレイしていないため、Steamの公式情報と開発元のFAQ、体験版へ寄せられたコミュニティ評価をもとに、どんなゲームなのかを整理する。

          > ※本記事は2026年8月7日時点の情報をもとにしている。体験版は継続的に更新されており、収録内容や対応言語、評価件数は今後変わる可能性がある。

          ## 『Guildrun』とは

          『Guildrun』は、Leylineが開発・販売するPvEローグライク・オートバトラーである。

          世界各地に発生した次元の裂け目「リフト」へ挑み、ヒーローを集めたギルドを育成しながら、その原因を追っていく。

          | 項目 | 内容 |
          |---|---|
          | 開発・販売 | Leyline |
          | ジャンル | PvEオートバトル・ローグライク・ストラテジー |
          | プレイ人数 | シングルプレイ中心 |
          | 対応OS | Windows / macOS |
          | 日本語 | 現時点では未対応 |
          | 体験版 | Steamで無料配信中 |
          | 体験版公開日 | 2026年7月16日 |
          | 製品版発売予定 | 開発元は2027年を目標としている |

          ![六角形の戦場にヒーローを配置するGuildrunの戦闘画面](../../assets/images/guildrun/screenshot-1.jpg)

          *戦闘は自動で進むが、配置や育成方針、編成の組み合わせが結果を大きく左右する。画像出典：[Steamストア](https://store.steampowered.com/app/3669200/Guildrun/)／© Leyline*

          ## クラスの枠を超えてヒーローを育てる

          本作で特に面白そうなのが、ヒーローの初期役割に縛られない育成システムである。

          公式では、後衛のヒーラーを前衛タンクへ変えたり、遠距離アタッカーを近接型へ作り替えたりできると紹介されている。初期クラスは出発点にすぎず、ラン中に選ぶ特化先や能力、アイテムによって最終的な役割が決まる。

          単純にレア度の高いキャラクターを並べるのではなく、手元に来た選択肢から編成を組み直す判断が重要になる。

          ![ヒーローの能力と特化先を選択するGuildrunの育成画面](../../assets/images/guildrun/screenshot-2.jpg)

          *同じヒーローでも、成長先によって別の役割を担える。完成形を決め打ちせず、そのランで引いた選択肢へ適応するゲームである。画像出典：[Steamストア](https://store.steampowered.com/app/3669200/Guildrun/)／© Leyline*

          ## 体験版だけでもかなりのボリューム

          Steamの公式説明によると、体験版だけで以下の要素が収録されている。

          - 25人のヒーロー
          - 180種類の特化
          - 300種類以上のレリック
          - 100種類以上のアイテム
          - 8段階の難易度
          - エンドレスモード
          - グローバルランキング

          体験版というより、すでに一本のローグライトとして遊び込める規模である。

          クリアするたびに次の難易度が解放され、最終的にはエンドレスモードで限界へ挑める。初回クリアだけで終わらず、異なる編成を試しながら繰り返す設計になっている。

          ## PvPなし、時間制限なしで考えられる

          オートバトラーでは、対人戦の流行や購入時間の制限に合わせて素早く判断する作品も多い。

          『Guildrun』は純粋なPvEを重視しており、PvPの実装予定はない。選択画面にタイマーもなく、途中保存にも対応するため、編成をじっくり考えられる。

          開発元のFAQでは、シングルプレイを中心としつつ、2人協力モードを開発中であることも案内されている。

          ![多数のヒーローと敵が戦うGuildrunのオートバトル画面](../../assets/images/guildrun/screenshot-3.jpg)

          *対人戦のメタを追うのではなく、PvEで強力な組み合わせを見つけることへ集中できる。画像出典：[Steamストア](https://store.steampowered.com/app/3669200/Guildrun/)／© Leyline*

          ## 日本語には未対応

          2026年8月7日時点で、体験版と製品版のSteamページは日本語に対応していない。

          対応言語は英語、ドイツ語、スペイン語、ポルトガル語、ロシア語、中国語の簡体字・繁体字である。開発元は今後さらに対応言語を増やす予定としているが、日本語追加の時期は発表されていない。

          アイテムや能力の説明を読みながらビルドを組むゲームなので、英語が苦手な場合は現状だとやや遊びにくい。日本語対応が決まれば、かなり入りやすくなりそうだ。

          ## 製品版への引き継ぎとSteam Deck対応

          開発元は、体験版で進めたメタ進行、難易度解放、ヒーローの熟練度を製品版へ引き継げるようにする予定だと説明している。

          Steam Deckについては、タッチパッドとL1・L2を使えばすでにプレイ可能とのこと。ただし正式なコントローラー対応やSteam Deck認証はまだ約束されていない。

          製品版は買い切り型を予定しており、発売目標は2027年。Steamストア上の正式な発売日は、現時点では「発表予定」となっている。

          ## 海外コミュニティの評価

          体験版は2026年8月7日時点で、Steamレビュー**1,166件中92％が好評**の「非常に好評」となっている。

          開発元によると、公開後約1週間で20万人以上が体験版をプレイし、リリース翌日にはSteam上の体験版ランキングで1位になったという。

          評価されている点としては、主に以下が挙げられる。

          - ヒーローの役割を自由に変えられる
          - アイテムとレリックの組み合わせが非常に多い
          - PvPやタイマーがなく、自分のペースで遊べる
          - 体験版とは思えないほど収録内容が多い
          - 強力な編成が完成したときの爽快感がある

          一方で、コミュニティではコントローラー対応、日本語を含む追加言語、バランス調整、細かな不具合への要望も見られる。

          開発チームは週単位でパッチを配信し、コミュニティの意見を反映した変更には印を付けて説明している。体験版の段階からプレイヤーと一緒に調整していく姿勢も、評価につながっていそうだ。

          ## 画像に生成AIは使われている？

          キャラクターイラストについて生成AIの使用を疑う声も出たが、開発元はFAQで、ゲーム内のアートは担当アーティストのKathi氏とDewi氏が手描きしており、生成AIは使用していないと説明している。

          絵柄だけで判断すると誤解が生まれやすい部分なので、開発元が明確に回答している点は記事内でも記録しておきたい。

          ## どんな人に合いそうか

          『Guildrun』は、以下のような人と相性がよさそうだ。

          - オートバトルは好きだが、PvPの環境についていくのは疲れる
          - キャラクターの役割を大胆に変えるビルドが好き
          - 『Slay the Spire』のように、提示された選択肢へ適応するローグライトが好き
          - アイテムや能力のシナジーを考える時間が好き
          - 一度のクリア後も高難度やエンドレスを遊び込みたい

          反対に、日本語で能力を細かく確認したい人や、ゲームパッドだけで快適に遊びたい人は、今後の対応を待ったほうがよいかもしれない。

          ## まとめ

          『Guildrun』は、PvEに特化し、ヒーローの役割を自由に変えられるローグライク・オートバトラーである。

          体験版だけでも25人のヒーロー、180種類の特化、300種類以上のレリックが用意されており、無料で試せる内容としてはかなり充実している。

          現時点で日本語へ対応していない点は惜しいが、1,000件を超えるレビューで「非常に好評」を獲得している注目作だ。オートバトルとビルド構築が好きなら、英語に抵抗がなければ体験版を触ってみる価値はありそうだ。

          - [『Guildrun』製品版のSteamページ](https://store.steampowered.com/app/3669200/Guildrun/)
          - [『Guildrun Demo』をSteamで無料プレイ](https://store.steampowered.com/app/4425970/Guildrun_Demo/)
          - [開発元による公式FAQ](https://steamcommunity.com/app/3669200/discussions/0/570417860284843351/)
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit article and images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-guildrun-article.yml
          git add src/content/blog/guildrun-overview.md src/assets/images/guildrun
          git commit -m "Add Guildrun overview"
          git push
